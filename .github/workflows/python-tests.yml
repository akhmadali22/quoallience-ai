name: Python tests # Run tests on each branch update

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and optional neural dependencies
        run: python -m pip install --upgrade pytest torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q
